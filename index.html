<!DOCTYPE html>
<html>
<head><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6a11cb">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPN Chat Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #0f172a; margin: 0; display: flex; justify-content: center; }
        .box { width: 100%; max-width: 600px; background: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #4f46e5; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; background: #f1f5f9; }
        .msg { padding: 10px 14px; margin: 8px 0; border-radius: 15px; max-width: 80%; }
        .user { background: #4f46e5; color: white; margin-left: auto; text-align: right; }
        .bot { background: white; border: 1px solid #ddd; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #4f46e5; color: white; border: none; padding: 12px 20px; margin-left: 8px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">🤖 SPN Chat Bot</div>
        <div id="chat"><div class="msg bot">Hi! I am SPN. Ask me anything!</div></div>
        <div class="input-area">
            <input id="msgInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>
    <script>
        async function sendMsg(){
            let input = document.getElementById("msgInput");
            let text = input.value.trim();
            if(!text) return;
            let chat = document.getElementById("chat");
            chat.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;
            let res = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message:text})});
            let data = await res.json();
            chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script></body>
</html>
